<!-- @startingPoint section="Screens" subtitle="PWA ledger — home, detail, add" viewport="900x760" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bancomer — PWA</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../shared-data.js"></script>
<style>body{margin:0;background:var(--surface-backdrop);min-height:100vh;font-family:var(--font-ui);color:var(--text-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="../screens.jsx"></script>
<script type="text/babel">
const LedgerApp = window.BancomerLedgerApp;
// Opaque navy action — no glass, no blur, per the PWA glass policy.
const navyAdd = (open) => (
  <div style={{position:'absolute',bottom:16,left:0,right:0,display:'flex',justifyContent:'center',zIndex:30}}>
    <div onClick={open} style={{cursor:'pointer',background:'var(--bbva-navy)',border:'1px solid var(--border-hairline)',borderRadius:999,padding:'11px 22px',fontSize:14,fontWeight:600,color:'var(--bbva-ink)',display:'flex',alignItems:'center',gap:8,boxShadow:'0 8px 22px rgba(0,0,0,0.45)'}}><span style={{fontSize:18,lineHeight:1,marginTop:-1}}>＋</span>Add transaction</div>
  </div>
);
function App() {
  const D = window.BANCOMER_DATA;
  return (
    <div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
      <header style={{background:'var(--surface-titlebar)',borderBottom:'1px solid var(--border-hairline)',padding:'0 20px',height:48,display:'flex',alignItems:'center',gap:10,position:'sticky',top:0,zIndex:5}}>
        <div style={{fontFamily:'var(--font-display)',fontWeight:600,fontSize:17,color:'#FFFFFF',letterSpacing:'-0.01em'}}>Bancomer</div>
        <div style={{fontSize:12,color:'var(--bbva-ink-faint)',marginLeft:'auto',fontVariantNumeric:'tabular-nums'}}>{D.dateLabel}</div>
      </header>
      <main style={{flex:1,display:'flex',justifyContent:'center',padding:'28px 16px'}}>
        <div style={{width:470,maxWidth:'100%',borderRadius:'var(--bbva-radius-frame)',overflow:'hidden',boxShadow:'0 18px 50px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.4)'}}>
          <LedgerApp height="620px" addAction={navyAdd} />
        </div>
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
