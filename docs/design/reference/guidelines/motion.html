<!-- @dsCard group="Brand" viewport="700x190" name="Motion" subtitle="iOS push 340ms cubic-bezier(.32,.72,.35,1) · home parallaxes back 28%" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-backdrop);font-family:var(--font-ui);color:var(--text-body);padding:16px;display:flex;gap:20px;align-items:center}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
.stage{position:relative;width:240px;height:140px;border-radius:12px;overflow:hidden;background:var(--bbva-bg);border:1px solid var(--bbva-line)}
.pane{position:absolute;inset:0}
@media (prefers-reduced-motion: no-preference){.home{animation:par 2.4s var(--bbva-motion-ease) infinite alternate}.det{animation:push 2.4s var(--bbva-motion-ease) infinite alternate}}
@keyframes par{0%,35%{transform:translateX(0)}65%,100%{transform:translateX(-28%)}}
@keyframes push{0%,35%{transform:translateX(102%)}65%,100%{transform:translateX(0)}}
.t{font-size:12px;color:var(--text-secondary);line-height:1.7;max-width:360px}
</style></head><body>
<div class="stage">
<div class="pane home" style="background:linear-gradient(180deg,#051730,#0A2E5C)"></div>
<div class="pane det" style="background:var(--bbva-bg);box-shadow:-12px 0 28px rgba(0,0,0,.5)"></div>
</div>
<div class="t">Navigation is an iOS-style push: detail slides in from the right over <b>340ms</b> on <b>cubic-bezier(0.32, 0.72, 0.35, 1)</b>; home parallaxes back 28% beneath; incoming pane carries a left-edge shadow. Pop reverses. All transitions gated on <b>prefers-reduced-motion</b>. Chrome never moves — content scrolls per pane.</div>
</body></html>
