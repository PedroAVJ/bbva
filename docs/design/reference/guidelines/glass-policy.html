<!-- @dsCard group="Brand" viewport="700x170" name="Glass policy" subtitle="iOS: Liquid Glass for nav & actions only · PWA: same brand, no glass imitation" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-backdrop);font-family:var(--font-ui);color:var(--text-body);padding:16px;display:flex;gap:16px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.col{flex:1;border-radius:12px;overflow:hidden;position:relative;height:128px;background:linear-gradient(180deg,#051730,#0A2E5C)}.cap{font-size:11px;color:var(--text-tertiary);position:absolute;top:8px;left:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}.num{font-family:var(--font-display);font-weight:600;font-size:30px;color:var(--bbva-teal);position:absolute;top:34px;left:12px;font-variant-numeric:tabular-nums}</style>
</head><body>
<div class="col"><div class="cap">iOS · glass nav bar</div><div class="num">+2,340</div>
<div style="position:absolute;left:10px;right:10px;bottom:10px;height:40px;border-radius:20px;background:rgba(232,238,245,0.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(232,238,245,0.14);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--bbva-ink)">Liquid Glass — navigation & actions only</div></div>
<div class="col"><div class="cap">PWA · opaque chrome</div><div class="num">+2,340</div>
<div style="position:absolute;left:0;right:0;bottom:0;height:44px;background:var(--bbva-navy);border-top:1px solid var(--bbva-line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--bbva-ink)">Opaque navy bar — no native glass imitation</div></div>
</body></html>
