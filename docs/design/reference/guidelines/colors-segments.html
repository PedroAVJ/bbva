<!-- @dsCard group="Colors" viewport="700x150" name="Segment ramp" subtitle="Categorical blues seg1–seg5 — color follows the entity, never the rank" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-app);font-family:var(--font-ui);display:flex;gap:2px;padding:16px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.sw{flex:1;height:84px;padding:10px 12px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end}.nm{font-size:12px;font-weight:700}.hx{font-size:11px;font-variant-numeric:tabular-nums;opacity:.75}</style>
</head><body>
<div class="sw" style="background:var(--seg1);border-radius:5px 0 0 5px;color:#fff"><div class="nm">seg1</div><div class="hx">#3A6EA8</div></div>
<div class="sw" style="background:var(--seg2);color:#fff"><div class="nm">seg2</div><div class="hx">#4E8FD0</div></div>
<div class="sw" style="background:var(--seg3);color:#08213D"><div class="nm">seg3</div><div class="hx">#6FAEE3</div></div>
<div class="sw" style="background:var(--seg4);color:#08213D"><div class="nm">seg4</div><div class="hx">#9CCAF0</div></div>
<div class="sw" style="background:var(--seg5);border-radius:0 5px 5px 0;color:#08213D"><div class="nm">seg5</div><div class="hx">#C7E1F8</div></div>
</body></html>
