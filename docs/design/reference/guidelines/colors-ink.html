<!-- @dsCard group="Colors" viewport="700x150" name="Ink scale" subtitle="Three-step text hierarchy on navy" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-app);font-family:var(--font-ui);display:flex;gap:10px;padding:16px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.sw{flex:1;height:84px;border-radius:8px;border:1px solid var(--bbva-line);padding:10px 12px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}.hx{font-size:11px;color:var(--text-tertiary);font-variant-numeric:tabular-nums}</style>
</head><body>
<div class="sw"><div style="font-size:14px;color:var(--bbva-ink)">ink · primary text</div><div class="hx">#E8EEF5</div></div>
<div class="sw"><div style="font-size:14px;color:var(--bbva-ink-dim)">ink-dim · secondary</div><div class="hx">#9FB3C8</div></div>
<div class="sw"><div style="font-size:14px;color:var(--bbva-ink-faint)">ink-faint · tertiary</div><div class="hx">#66809B</div></div>
<div class="sw"><div style="font-size:14px;color:var(--bbva-hero-subtext)">hero subtext</div><div class="hx">#8FB8DA</div></div>
</body></html>
