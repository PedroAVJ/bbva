<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-backdrop);font-family:var(--font-ui);color:var(--text-body);display:flex;gap:10px;padding:16px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.sw{flex:1;height:84px;border-radius:8px;padding:10px 12px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end}.nm{font-size:12px;font-weight:600}.hx{font-size:11px;color:var(--text-tertiary);font-variant-numeric:tabular-nums}</style>
</head><body>
<div class="sw" style="background:var(--bbva-navy)"><div class="nm">navy · titlebar</div><div class="hx">#051730</div></div>
<div class="sw" style="background:var(--bbva-bg);border:1px solid var(--bbva-line)"><div class="nm">bg · app surface</div><div class="hx">#0E1E33</div></div>
<div class="sw" style="background:var(--bbva-bg-deep);border:1px solid var(--bbva-line)"><div class="nm">bg-deep · backdrop</div><div class="hx">#0A1526</div></div>
<div class="sw" style="background:var(--bbva-line)"><div class="nm">line · hairlines</div><div class="hx">#20395B</div></div>
</body></html>
