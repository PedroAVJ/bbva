<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Teal = positive / Yours · Coral = negative · Aqua = kickers & links" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-app);font-family:var(--font-ui);display:flex;gap:10px;padding:16px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.sw{flex:1;height:84px;border-radius:8px;padding:10px 12px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end}.nm{font-size:12px;font-weight:700;color:#051730}.hx{font-size:11px;color:rgba(5,23,48,.7);font-variant-numeric:tabular-nums}</style>
</head><body>
<div class="sw" style="background:var(--bbva-teal)"><div class="nm">teal · positive · Yours</div><div class="hx">#35B392</div></div>
<div class="sw" style="background:var(--bbva-coral)"><div class="nm">coral · negative</div><div class="hx">#F07285</div></div>
<div class="sw" style="background:var(--bbva-accent-aqua)"><div class="nm">aqua · kicker / back</div><div class="hx">#49A5E6</div></div>
<div class="sw" style="background:var(--bbva-accent-aqua-hover)"><div class="nm">aqua hover</div><div class="hx">#5BBEFF</div></div>
</body></html>
