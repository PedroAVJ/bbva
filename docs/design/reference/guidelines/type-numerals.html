<!-- @dsCard group="Type" viewport="700x150" name="Numerals" subtitle="tabular-nums in every data row · signed with true minus −" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-app);font-family:var(--font-ui);color:var(--text-body);padding:16px;display:flex;gap:32px;align-items:center}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.col{font-size:13px;font-variant-numeric:tabular-nums;line-height:1.8}.t{font-size:11px;color:var(--text-tertiary);max-width:230px;line-height:1.55}</style>
</head><body>
<div class="col" style="text-align:right">9,000/mo · 300/day<br>6,000/mo · 200/day<br><span style="color:var(--bbva-teal);font-weight:600">15,000/mo · 500/day</span></div>
<div class="col"><span style="color:var(--bbva-coral)">−1,200</span> · <span style="color:var(--bbva-teal)">+400</span></div>
<div class="t">font-variant-numeric: tabular-nums in every data row so columns align. Signs use the true minus sign (−, U+2212), never a hyphen. en-US thousands separators.</div>
</body></html>
