<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-app);font-family:var(--font-ui);color:var(--text-body);padding:10px 18px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.r{display:flex;justify-content:space-between;font-size:13px;padding:8px 0}.a{font-size:12px;color:var(--text-secondary);font-variant-numeric:tabular-nums}</style>
</head><body>
<div class="r"><span>Health</span><span class="a">9,000/mo</span></div>
<div class="r" style="border-top:1px solid var(--bbva-line)"><span>Debt</span><span class="a">6,000/mo</span></div>
<div class="r" style="border-top:2px solid var(--bbva-teal);font-weight:700"><span>Yours</span><span class="a" style="color:var(--bbva-teal);font-weight:600">15,000/mo</span></div>
</body></html>
