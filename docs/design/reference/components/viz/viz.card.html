<!-- @dsCard group="Components" viewport="700x300" name="Data viz" subtitle="CompositionBar · zoomShade · DailyNetStrip" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-app);font-family:var(--font-ui);color:var(--text-body);padding:18px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-secondary);margin:14px 0 8px}.lbl:first-child{margin-top:0}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { CompositionBar, DailyNetStrip, ZoomShade } = window.BancomerDesignSystem_930545;
const zoomShade = ZoomShade || ((base,i,n)=>`color-mix(in oklab, ${base}, white ${n<=1?0:Math.round(50*i/(n-1))}%)`);
const App = () => (
  <div>
    <div className="lbl">Income composition</div>
    <CompositionBar segments={[
      {amount:9000,color:'var(--seg1)',label:'20%'},
      {amount:6000,color:'var(--seg3)',label:'DEBT 13%',darkLabel:true},
      {amount:3000,color:'var(--seg2)',label:'AI 7%'},
      {amount:9000,color:'var(--seg4)',label:'20%',darkLabel:true},
      {amount:3000,color:'var(--seg5)',label:'7%',darkLabel:true},
      {amount:15000,color:'var(--bbva-teal)',label:'YOURS 33%',darkLabel:true},
    ]} />
    <div className="lbl">Flamegraph zoom (Housing, zoomed)</div>
    <CompositionBar segments={[7500,1000,500].map((v,i)=>({amount:v,color:zoomShade('#9CCAF0',i,3),label:v>=1000?Math.round(100*v/9000)+'%':'',darkLabel:true}))} />
    <div className="lbl">Daily net · last 14 days</div>
    <DailyNetStrip values={[40,90,-60,20,150,-1200,130,40,-180,400,-80,55,110,125]} />
  </div>
);
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
