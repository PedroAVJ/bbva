<!DOCTYPE html>

</head><body><div id="root"></div>
<script type="text/babel">
const { CategoryRow, ItemRow, TransactionRow, ZoomShade } = window.BancomerDesignSystem_930545;
const zoomShade = ZoomShade || ((base,i,n)=>`color-mix(in oklab, ${base}, white ${n<=1?0:Math.round(50*i/(n-1))}%)`);
const noop = () => {};
const App = () => (
  <div>
    <div className="lbl">Category legend (drillable)</div>
    <CategoryRow name="Health" amount="9,000/mo · 300/day" pct="20%" color="var(--seg1)" onClick={noop} first />

    <CategoryRow name="Yours" amount="15,000/mo · 500/day" pct="33%" color="var(--bbva-teal)" emphasized onClick={noop} />
    <div className="lbl">Detail items</div>
    <ItemRow name="Rent" mo="7,500" day="250" pct="83%" color={zoomShade('#9CCAF0',0,3)} first />
    <ItemRow name="Internet" mo="1,000" day="33" pct="11%" color={zoomShade('#9CCAF0',1,3)} />
    <ItemRow name="Power" mo="500" day="17" pct="6%" color={zoomShade('#9CCAF0',2,3)} />
    <div className="lbl">Ledger transactions</div>
    {TransactionRow ? <><TransactionRow desc="Rent" meta="Jan 1 · Housing & utilities" amount="−7,500" color="var(--seg4)" recurring first />
    <TransactionRow desc="Salary" meta="Jan 1 · for Me" amount="+45,000" color="var(--bbva-teal)" positive recurring /></> : null}
  </div>
);
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
